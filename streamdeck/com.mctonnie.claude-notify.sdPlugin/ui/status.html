<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Notify session status</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Sessions">
			<sdpi-checkbox setting="allSessions" default="false" label="Show all sessions, idle ones too"></sdpi-checkbox>
		</sdpi-item>
		<p style="color:#9aa0ab;font-size:11px;margin:8px 12px">Off: only busy sessions (working, needs your answer, finished and not seen). On: every session in the Claude app that isn't archived, most recent first. Turn to switch, press or tap to open.</p>
	</body>
</html>
