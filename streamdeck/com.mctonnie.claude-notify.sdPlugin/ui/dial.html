<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Notify dial</title>
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Needs sound">
			<sdpi-select setting="needsSound" default="needs">
				<option value="needs">Needs chime (rising)</option>
				<option value="finished">Finished chime (ding)</option>
				<option value="reminder">Reminder tick</option>
				<option value="custom">My own file…</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Needs file">
			<sdpi-file setting="needsFile" accept=".wav,.mp3"></sdpi-file>
		</sdpi-item>
		<sdpi-item label="Finished sound">
			<sdpi-select setting="finishedSound" default="finished">
				<option value="needs">Needs chime (rising)</option>
				<option value="finished">Finished chime (ding)</option>
				<option value="reminder">Reminder tick</option>
				<option value="custom">My own file…</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Finished file">
			<sdpi-file setting="finishedFile" accept=".wav,.mp3"></sdpi-file>
		</sdpi-item>
		<sdpi-item label="Volume">
			<sdpi-range setting="volume" min="0" max="100" step="5" default="70" showlabels></sdpi-range>
		</sdpi-item>
		<sdpi-item label="Remind every">
			<sdpi-select setting="reminder" default="0">
				<option value="0">Off</option>
				<option value="2">2 minutes</option>
				<option value="5">5 minutes</option>
				<option value="10">10 minutes</option>
				<option value="15">15 minutes</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Reminder sound">
			<sdpi-select setting="reminderSound" default="reminder">
				<option value="reminder">Quiet tick</option>
				<option value="main">Same as the chime</option>
			</sdpi-select>
		</sdpi-item>
		<p style="color:#9aa0ab;font-size:11px;margin:8px 12px">Turn to browse waiting sessions, press or tap to open, hold a touch to dismiss. Sounds here are used only when no Needs, Finished or Combined key is on screen.</p>
	</body>
</html>
